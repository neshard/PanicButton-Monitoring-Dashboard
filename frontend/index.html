<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Panic Monitor</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar">
        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </div>
        <div id="sidebar-content" class="hidden">
            <div id="sidebar-header">
                <span>Railway Panic Monitor</span>
                <button id="close-sidebar">&times;</button>
            </div>
            <div id="tabs">
                <button class="tab-btn active" data-tab="jpl">JPL</button>
                <button class="tab-btn" data-tab="train">Kereta</button>
                <button class="tab-btn" data-tab="log">Event Log</button>
            </div>
            <div id="tab-content">
                <div id="tab-jpl" class="tab-pane active">
                    <table id="jpl-table">
                        <thead><tr><th>func_loc</th><th>ba</th><th>Lokasi</th><th>Status</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="tab-train" class="tab-pane">
                    <table id="train-table">
                        <thead><tr><th>VTDID</th><th>SARANA</th><th>KERETA</th><th>Speed</th><th>Location</th><th>Received</th><th>Status</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="tab-log" class="tab-pane">
                    <table id="log-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Time</th>
                                <th>Type</th>
                                <th>Trigger</th>
                                <th>Device</th>
                                <th>Funcloc</th>
                                <th>JPL Lat</th>
                                <th>JPL Lon</th>
                                <th>VTDID</th>
                                <th>Loco Lat</th>
                                <th>Loco Lon</th>
                                <th>Dist (m)</th>
                                <th>Prev Alert</th>
                                <th>Alert Changed</th>
                                <th>Release Count</th>
                                <th>Speed</th>
                                <th>Location</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="alert-stack"></div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
